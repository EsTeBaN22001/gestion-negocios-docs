services:
  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gestion-negocios-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestion_negocios}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion-negocios-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: >-
        Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-gestion_negocios};User=${MYSQL_USER:-appuser};Password=${MYSQL_PASSWORD:-change-me};
      Cors__AllowedOrigins__0: "http://localhost:4200"
    ports:
      - "5000:8080"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion-negocios-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
